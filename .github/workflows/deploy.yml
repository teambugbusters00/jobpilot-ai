name: Deploy JobPilot AI to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Chrome Extension Artifact
        run: |
          cd chrome-extension && zip -r ../web/jobpilot-ai-extension-v1.0.0.zip . && cd ..

      - name: Upload Chrome Extension Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-ai-chrome-extension
          path: web/jobpilot-ai-extension-v1.0.0.zip
          retention-days: 90

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
